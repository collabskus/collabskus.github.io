<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <meta name="theme-color" content="#667eea" />
   <title>Kathmandu Calendar & Time</title>
   <base href="/" />
   <link rel="stylesheet" href="css/app.css" />
   <link rel="icon" type="image/png" href="favicon.png" />
   <link href="CollabsKus.BlazorWebAssembly.styles.css" rel="stylesheet" />
   <link href="manifest.webmanifest" rel="manifest" />
   <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
   <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
   <div id="app">
      <svg class="loading-progress">
         <circle r="40%" cx="50%" cy="50%" />
         <circle r="40%" cx="50%" cy="50%" />
      </svg>
      <div class="loading-progress-text"></div>
   </div>

   <div id="blazor-error-ui">
      An unhandled error has occurred.
      <a href="." class="reload">Reload</a>
      <a class="dismiss">🗙</a>
   </div>

   <div id="app-update" class="app-update" role="status" hidden>
      A new version is available.
      <button type="button" id="app-update-reload" class="app-update-reload">Reload</button>
   </div>

   <script>
      (function (l) {
         if (l.search[1] === '/') {
            var decoded = l.search.slice(1).split('&').map(function (s) {
               return s.replace(/~and~/g, '&');
            }).join('?');
            window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
         }
      }(window.location));
   </script>
   <script src="js/interop.js"></script>
   <script src="js/pwa.js"></script>
   <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
